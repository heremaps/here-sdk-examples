// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// Valid values: LOCAL_BUNDLE (default), COMPONENTS_FROM_ARTIFACTORY
// Pass -PHERESDKBuildType=COMPONENTS_FROM_ARTIFACTORY to build with components fetched from Artifactory.
ext.HERESDKBuildConfig = project.findProperty('HERESDKBuildType') ?: "LOCAL_BUNDLE"

allprojects {
    repositories {
        google()
        mavenCentral()

        if (rootProject.ext.HERESDKBuildConfig == "COMPONENTS_FROM_ARTIFACTORY") {
            maven {
                name = 'HERE_SDK_Artifactory_Repository'
                url = project.findProperty('HERESDKArtifactoryURL') ?: "https://repo.platform.here.com/artifactory/here-sdk-android"
                credentials {
                    // Use the username and token created on https://platform.here.com/access/access-tokens.
                    username = project.findProperty('HERESDKArtifactoryUsername') ?: "YOUR_USER_NAME"
                    password = project.findProperty('HERESDKArtifactoryPassword') ?: "YOUR_ACCESS_TOKEN"
                }
                content {
                    includeGroup "com.here.here-sdk.java.components"
                }
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.deprecation = true
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
